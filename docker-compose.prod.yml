services:
  nginx:
    image: nginx
    build:
      context: ./
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:8080"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      # - ./private.key:/etc/nginx/ssl/private.key
      # - ./ssl-certif.crt:/etc/nginx/ssl/ssl-certif.crt
    depends_on:
      - matcha  # Ensures server starts before nginx
    networks:
      - app-network

  matcha:
    image: matcha-sveltkit-prod
    restart: on-failure
    build:
      context: ./
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    container_name: matcha-sveltkit-prod
    # ports:
    #   - 3000:3000
    volumes:
      - ./database:/usr/src/app/database
      - ./profile-pictures:/usr/src/app/profile-pictures
      - /usr/src/app/node_modules
    networks:
      - app-network

  db_viz:
    image: sqlite-web
    restart: on-failure
    build:
      context: ./
      dockerfile: Dockerfile.db-viz
    container_name: sqlite-web
    ports:
      - 4565:4565
    volumes:
      - ./database:/data
    environment:
      - SQLITE_DATABASE=/data/database.db
      - PORT=4565

networks:
  app-network:
    driver: bridge
